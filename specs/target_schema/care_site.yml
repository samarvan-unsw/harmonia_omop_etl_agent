version: 1
cdm_version: '5.4'
target_table: care_site
cdm_schema: CDM
required: false
concept_prefix: null
measure_person_completeness: false
measure_person_completeness_threshold: null
description: >-
  The CARE_SITE table contains a list of uniquely identified institutional (physical or organizational)
  units where healthcare delivery is practiced (offices, wards, hospitals, clinics, etc.).
user_guidance: ""
etl_convention: >-
  Care site is a unique combination of location_id and nature of the site - the latter could be the place
  of service, name, or another characteristic in your source data. Care site does not take into account
  the provider (human) information such a specialty. Many source data do not make a distinction between
  individual and institutional providers. The CARE_SITE table contains the institutional providers. If
  the source, instead of uniquely identifying individual Care Sites, only provides limited information
  such as Place of Service, generic or "pooled" Care Site records are listed in the CARE_SITE table. There
  can be hierarchical and business relationships between Care Sites. For example, wards can belong to
  clinics or departments, which can in turn belong to hospitals, which in turn can belong to hospital
  systems, which in turn can belong to HMOs.The relationships between Care Sites are defined in the FACT_RELATIONSHIP
  table.


  For additional detailed conventions on how to populate this table, please refer to [THEMIS repository](https://ohdsi.github.io/Themis/care_site.html).
fields:
- name: care_site_id
  data_type: integer
  required: true
  primary_key: true
  description: ""
  etl_convention: >-
    Assign an ID to each combination of a location and nature of the site - the latter could be the Place
    of Service, name or another characteristic in your source data.
- name: care_site_name
  data_type: varchar(255)
  required: false
  primary_key: false
  description: >-
    The name of the care_site as it appears in the source data
  etl_convention: ""
- name: place_of_service_concept_id
  data_type: integer
  required: false
  primary_key: false
  foreign_key:
    table: concept
    field: concept_id
  description: >-
    This is a high-level way of characterizing a Care Site. Typically, however, Care Sites can provide
    care in multiple settings (inpatient, outpatient, etc.) and this granularity should be reflected in
    the visit.
  etl_convention: >-
    Choose the concept in the visit domain that best represents the setting in which healthcare is provided
    in the Care Site. If most visits in a Care Site are Inpatient, then the place_of_service_concept_id
    should represent Inpatient. If information is present about a unique Care Site (e.g. Pharmacy) then
    a Care Site record should be created. [Accepted Concepts](https://athena.ohdsi.org/search-terms/terms?domain=Visit&standardConcept=Standard&page=2&pageSize=15&query=).
    For information about how to populate this field please see the [THEMIS Conventions](https://ohdsi.github.io/Themis/tag_place_of_service.html).
- name: location_id
  data_type: integer
  required: false
  primary_key: false
  foreign_key:
    table: location
    field: location_id
  description: >-
    The location_id from the LOCATION table representing the physical location of the care_site.
  etl_convention: ""
- name: care_site_source_value
  data_type: varchar(50)
  required: false
  primary_key: false
  description: >-
    The identifier of the care_site as it appears in the source data. This could be an identifier separate
    from the name of the care_site.
  etl_convention: ""
- name: place_of_service_source_value
  data_type: varchar(50)
  required: false
  primary_key: false
  description: ""
  etl_convention: >-
    Put the place of service of the care_site as it appears in the source data.
