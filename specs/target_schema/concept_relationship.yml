description: >-
  The CONCEPT_RELATIONSHIP table contains records that define relationships between any two Concepts and
  the nature or type of the relationship. This table captures various types of relationships, including
  hierarchical, associative, and other semantic connections, enabling comprehensive analysis and interpretation
  of clinical concepts. Every kind of relationship is defined in the RELATIONSHIP table.
user_guidance: >-
  The CONCEPT_RELATIONSHIP table can be used to explore hierarchical or attribute relationships between
  concepts to understand the hierarchical structure of clinical concepts and uncover implicit connections
  and associations within healthcare data. For example, users can utilize mapping relationships ('Maps
  to') to harmonize data from different sources and terminologies, enabling interoperability and data
  integration across disparate datasets.
