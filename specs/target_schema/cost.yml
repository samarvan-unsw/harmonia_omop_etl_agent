target_table: cost
cdm_schema: CDM
required: false
concept_prefix: null
measure_person_completeness: false
measure_person_completeness_threshold: null
description: >-
  The COST table captures records containing the cost of any medical event recorded in one of the OMOP
  clinical event tables such as DRUG_EXPOSURE, PROCEDURE_OCCURRENCE, VISIT_OCCURRENCE, VISIT_DETAIL, DEVICE_OCCURRENCE,
  OBSERVATION or MEASUREMENT.


  Each record in the cost table account for the amount of money transacted for the clinical event. So,
  the COST table may be used to represent both receivables (charges) and payments (paid), each transaction
  type represented by its COST_CONCEPT_ID. The COST_TYPE_CONCEPT_ID field will use concepts in the Standardized
  Vocabularies to designate the source (provenance) of the cost data. A reference to the health plan information
  in the PAYER_PLAN_PERIOD table is stored in the record for information used for the adjudication system
  to determine the persons benefit for the clinical event.
user_guidance: >-
  When dealing with summary costs, the cost of the goods or services the provider provides is often not
  known directly, but derived from the hospital charges multiplied by an average cost-to-charge ratio.
etl_convention: >-
  One cost record is generated for each response by a payer. In a claims databases, the payment and payment
  terms reported by the payer for the goods or services billed will generate one cost record. If the source
  data has payment information for more than one payer (i.e. primary insurance and secondary insurance
  payment for one entity), then a cost record is created for each reporting payer. Therefore, it is possible
  for one procedure to have multiple cost records for each payer, but typically it contains one or no
  record per entity. Payer reimbursement cost records will be identified by using the PAYER_PLAN_ID field.
  Drug costs are composed of ingredient cost (the amount charged by the wholesale distributor or manufacturer),
  the dispensing fee (the amount charged by the pharmacy and the sales tax).
