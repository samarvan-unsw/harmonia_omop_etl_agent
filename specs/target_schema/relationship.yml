description: >-
  The RELATIONSHIP table provides a reference list of all types of relationships that can be used to associate
  any two Concepts in the CONCEPT_RELATIONSHIP table, the respective reverse relationships, and their
  hierarchical characteristics. Note, that Concepts representing relationships between the clinical facts,
  used for filling in the FACT_RELATIONSHIP table are stored in the CONCEPT table and belong to the Relationship
  Domain.
user_guidance: >-
  Users can leverage the RELATIONSHIP table to explore the full list of direct and reverse relationships
  within the OMOP vocabulary system. Also, users can get insight into how these relationships can be used
  in ETL, cohort creation, and other tasks according to their ancestral characteristics.
