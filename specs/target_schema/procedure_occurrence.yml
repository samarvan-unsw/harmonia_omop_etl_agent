# Generated from OHDSI CommonDataModel metadata.
# Source commit: f853f6e39c61b4eb8b3e5287fd573a1ced36c0e4
# Regenerate with: python scripts/generate_target_schemas.py
version: 1
display_order: 7
cdm_version: '5.4'
target_table: procedure_occurrence
cdm_schema: CDM
required: false
concept_prefix: PROCEDURE_
measure_person_completeness: true
measure_person_completeness_threshold: 0.0
description: >-
  This table contains records of activities or processes ordered by, or carried out by, a healthcare provider
  on the patient with a diagnostic or therapeutic purpose.
user_guidance: >-
  Lab tests are not a procedure, if something is observed with an expected resulting amount and unit then
  it should be a measurement. Phlebotomy is a procedure but so trivial that it tends to be rarely captured.
  It can be assumed that there is a phlebotomy procedure associated with many lab tests, therefore it
  is unnecessary to add them as separate procedures.
etl_convention: >-
  When dealing with duplicate records, the ETL must determine whether to sum them up into one record or
  keep them separate. Things to consider are:


  - Same Procedure

  - Same procedure_datetime

  - Same Visit Occurrence or Visit Detail

  - Same Provider

  - Same Modifier for Procedures.


  Source codes and source text fields mapped to Standard Concepts of the Procedure Domain have to be recorded
  here.
fields:
- name: procedure_occurrence_id
  data_type: integer
  required: true
  primary_key: true
  description: >-
    The unique key given to a procedure record for a person. Refer to the ETL for how duplicate procedures
    during the same visit were handled.
  etl_convention: >-
    Each instance of a procedure occurrence in the source data should be assigned this unique key. In
    some cases, a person can have multiple records of the same procedure within the same visit. It is
    valid to keep these duplicates and assign them individual, unique, PROCEDURE_OCCURRENCE_IDs, though
    it is up to the ETL how they should be handled.
- name: person_id
  data_type: integer
  required: true
  primary_key: false
  foreign_key:
    table: person
    field: person_id
  description: >-
    The PERSON_ID of the PERSON for whom the procedure is recorded. This may be a system generated code.
  etl_convention: ""
- name: procedure_concept_id
  data_type: integer
  required: true
  primary_key: false
  foreign_key:
    table: concept
    field: concept_id
    domain: Procedure
  description: >-
    The PROCEDURE_CONCEPT_ID field is recommended for primary use in analyses, and must be used for network
    studies. This is the standard concept mapped from the source value which represents a procedure
  etl_convention: >-
    The CONCEPT_ID that the PROCEDURE_SOURCE_VALUE maps to. Only records whose source values map to standard
    concepts with a domain of "Procedure" should go in this table. [Accepted Concepts](https://athena.ohdsi.org/search-terms/terms?domain=Procedure&standardConcept=Standard&page=1&pageSize=15&query=).
- name: procedure_date
  data_type: date
  required: true
  primary_key: false
  description: >-
    Use this date to determine the date the procedure started.
  etl_convention: >-
    This is meant to be the **start date** of the procedure. It will be renamed in a future version to
    **PROCEDURE_START_DATE**.
- name: procedure_datetime
  data_type: datetime
  required: false
  primary_key: false
  description: ""
  etl_convention: >-
    If the procedure has a start time in the native date, use this field to house that information. This
    will be renamed in a future version to **PROCEDURE_START_DATETIME**.
- name: procedure_end_date
  data_type: date
  required: false
  primary_key: false
  description: >-
    Use this field to house the date that the procedure ended.
  etl_convention: >-
    This is meant to be the end date of the procedure. It is not required and for most cases will be the
    same as the PROCEDURE_START_DATE.
- name: procedure_end_datetime
  data_type: datetime
  required: false
  primary_key: false
  description: >-
    Use this field to house the datetime that the procedure ended.
  etl_convention: >-
    This is meant to house the end datetime of the procedure and will most often be used in conjunction
    with the procedure_start_datetime to determine the length of the procedure.
- name: procedure_type_concept_id
  data_type: integer
  required: true
  primary_key: false
  foreign_key:
    table: concept
    field: concept_id
    domain: Type Concept
  description: >-
    This field can be used to determine the provenance of the Procedure record, as in whether the procedure
    was from an EHR system, insurance claim, registry, or other sources.
  etl_convention: >-
    Choose the PROCEDURE_TYPE_CONCEPT_ID that best represents the provenance of the record, for example
    whether it came from an EHR record or billing claim. If a procedure is recorded as an EHR encounter,
    the PROCEDURE_TYPE_CONCEPT would be 'EHR encounter record'. [Accepted Concepts](https://athena.ohdsi.org/search-terms/terms?domain=Type+Concept&standardConcept=Standard&page=1&pageSize=15&query=).
    A more detailed explanation of each Type Concept can be found on the [vocabulary wiki](https://github.com/OHDSI/Vocabulary-v5.0/wiki/Vocab.-TYPE_CONCEPT).
- name: modifier_concept_id
  data_type: integer
  required: false
  primary_key: false
  foreign_key:
    table: concept
    field: concept_id
  description: >-
    The modifiers are intended to give additional information about the procedure but as of now the vocabulary
    is under review.
  etl_convention: >-
    It is up to the ETL to choose how to map modifiers if they exist in source data. These concepts are
    typically distinguished by 'Modifier' concept classes (e.g., 'CPT4 Modifier' as part of the 'CPT4'
    vocabulary). If there is more than one modifier on a record, one should be chosen that pertains to
    the procedure rather than provider. [Accepted Concepts](https://athena.ohdsi.org/search-terms/terms?conceptClass=CPT4+Modifier&conceptClass=HCPCS+Modifier&vocabulary=CPT4&vocabulary=HCPCS&standardConcept=Standard&page=1&pageSize=15&query=).
- name: quantity
  data_type: integer
  required: false
  primary_key: false
  description: >-
    If the quantity value is omitted, a single procedure is assumed.
  etl_convention: >-
    If a Procedure has a quantity of '0' in the source, this should default to '1' in the ETL. If there
    is a record in the source it can be assumed the exposure occurred at least once
- name: provider_id
  data_type: integer
  required: false
  primary_key: false
  foreign_key:
    table: provider
    field: provider_id
  description: >-
    The provider associated with the procedure record, e.g. the provider who performed the Procedure.
  etl_convention: >-
    The ETL may need to make a choice as to which PROVIDER_ID to put here. Based on what is available
    this may or may not be different than the provider associated with the overall VISIT_OCCURRENCE record,
    for example the admitting vs attending physician on an EHR record.
- name: visit_occurrence_id
  data_type: integer
  required: false
  primary_key: false
  foreign_key:
    table: visit_occurrence
    field: visit_occurrence_id
  description: >-
    The visit during which the procedure occurred.
  etl_convention: >-
    Depending on the structure of the source data, this may have to be determined based on dates. If a
    PROCEDURE_DATE occurs within the start and end date of a Visit it is a valid ETL choice to choose
    the VISIT_OCCURRENCE_ID from the Visit that subsumes it, even if not explicitly stated in the data.
    While not required, an attempt should be made to locate the VISIT_OCCURRENCE_ID of the PROCEDURE_OCCURRENCE
    record.
- name: visit_detail_id
  data_type: integer
  required: false
  primary_key: false
  foreign_key:
    table: visit_detail
    field: visit_detail_id
  description: >-
    The VISIT_DETAIL record during which the Procedure occurred. For example, if the Person was in the
    ICU at the time of the Procedure the VISIT_OCCURRENCE record would reflect the overall hospital stay
    and the VISIT_DETAIL record would reflect the ICU stay during the hospital visit.
  etl_convention: >-
    Same rules apply as for the VISIT_OCCURRENCE_ID.
- name: procedure_source_value
  data_type: varchar(50)
  required: false
  primary_key: false
  description: >-
    This field houses the verbatim value from the source data representing the procedure that occurred.
    For example, this could be an CPT4 or OPCS4 code.
  etl_convention: >-
    Use this value to look up the source concept id and then map the source concept id to a standard concept
    id.
- name: procedure_source_concept_id
  data_type: integer
  required: false
  primary_key: false
  foreign_key:
    table: concept
    field: concept_id
  description: >-
    This is the concept representing the procedure source value and may not necessarily be standard. This
    field is discouraged from use in analysis because it is not required to contain Standard Concepts
    that are used across the OHDSI community, and should only be used when Standard Concepts do not adequately
    represent the source detail for the Procedure necessary for a given analytic use case. Consider using
    PROCEDURE_CONCEPT_ID instead to enable standardized analytics that can be consistent across the network.
  etl_convention: >-
    If the PROCEDURE_SOURCE_VALUE is coded in the source data using an OMOP supported vocabulary put the
    concept id representing the source value here.
- name: modifier_source_value
  data_type: varchar(50)
  required: false
  primary_key: false
  description: >-
    This field houses the verbatim value from the source data representing the modifier code for the procedure
    that occurred.
  etl_convention: >-
    The value stored here is mapped to a MODIFIER_CONCEPT_ID.
