- name: term_modifiers
  data_type: varchar(2000)
  required: false
  primary_key: false
  description: ""
  etl_convention: >-
    For the modifiers that are there, they would have to have these values:


    - Negation = false

    - Subject = patient

    - Conditional = false

    - Rule_out = false

    - Uncertain = true or high or moderate or even low (could argue about low). Term_modifiers will concatenate
    all modifiers for different types of entities (conditions, drugs, labs etc) into one string. Lab values
