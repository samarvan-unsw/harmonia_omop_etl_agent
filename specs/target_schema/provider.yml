version: 1
display_order: 18
cdm_version: '5.4'
target_table: provider
cdm_schema: CDM
required: false
concept_prefix: null
measure_person_completeness: false
measure_person_completeness_threshold: null
description: >-
  The PROVIDER table contains a list of uniquely identified healthcare providers; duplication is not allowed.
  These are individuals providing hands-on healthcare to patients, such as physicians, nurses, midwives,
  physical therapists etc.
user_guidance: >-
  Many sources do not make a distinction between individual and institutional providers. The PROVIDER
  table contains the individual providers. If the source only provides limited information such as specialty
  instead of uniquely identifying individual providers, generic or 'pooled' Provider records are listed
  in the PROVIDER table.
etl_convention: ""
fields:
- name: provider_id
  data_type: integer
  required: true
  primary_key: true
  description: >-
    It is assumed that every provider with a different unique identifier is in fact a different person
    and should be treated independently.
  etl_convention: >-
    This identifier can be the original id from the source data provided it is an integer, otherwise it
    can be an autogenerated number.
- name: provider_name
  data_type: varchar(255)
  required: false
  primary_key: false
  description: >-
    This field contains information that describes a healthcare provider.
  etl_convention: >-
    This field is not required for identifying the Provider's actual identity. Instead, its purpose is
    to uniquely and/or anonymously identify providers of care across the database.
- name: npi
  data_type: varchar(20)
  required: false
  primary_key: false
  description: >-
    This is the National Provider Number issued to health care providers in the US by the Centers for
    Medicare and Medicaid Services (CMS).
  etl_convention: ""
- name: dea
  data_type: varchar(20)
  required: false
  primary_key: false
  description: >-
    This is the identifier issued by the DEA, a US federal agency, that allows a provider to write prescriptions
    for controlled substances.
  etl_convention: ""
- name: specialty_concept_id
  data_type: integer
  required: false
  primary_key: false
  foreign_key:
    table: concept
    field: concept_id
  description: >-
    This field either represents the most common specialty that occurs in the data or the most specific
    concept that represents all specialties listed, should the provider have more than one. This includes
    physician specialties such as internal medicine, emergency medicine, etc. and allied health professionals
    such as nurses, midwives, and pharmacists.
  etl_convention: >-
    If a Provider has more than one Specialty, there are two options: 1. Choose a concept_id which is
    a common ancestor to the multiple specialties, or, 2. Choose the specialty that occurs most often
    for the provider. Concepts in this field should be Standard with a domain of Provider. [Accepted Concepts](http://athena.ohdsi.org/search-terms/terms?domain=Provider&standardConcept=Standard&page=1&pageSize=15&query=).
- name: care_site_id
  data_type: integer
  required: false
  primary_key: false
  foreign_key:
    table: care_site
    field: care_site_id
  description: >-
    This is the CARE_SITE_ID for the location that the provider primarily practices in.
  etl_convention: >-
    If a Provider has more than one Care Site, the main or most often exerted CARE_SITE_ID should be recorded.
- name: year_of_birth
  data_type: integer
  required: false
  primary_key: false
  description: ""
  etl_convention: ""
- name: gender_concept_id
  data_type: integer
  required: false
  primary_key: false
  foreign_key:
    table: concept
    field: concept_id
    domain: Gender
  description: >-
    This field represents the recorded gender of the provider in the source data.
  etl_convention: >-
    If given, put a concept from the gender domain representing the recorded gender of the provider. [Accepted
    Concepts](http://athena.ohdsi.org/search-terms/terms?domain=Gender&standardConcept=Standard&page=1&pageSize=15&query=).
- name: provider_source_value
  data_type: varchar(50)
  required: false
  primary_key: false
  description: >-
    Use this field to link back to providers in the source data. This is typically used for error checking
    of ETL logic.
  etl_convention: >-
    Some use cases require the ability to link back to providers in the source data. This field allows
    for the storing of the provider identifier as it appears in the source.
- name: specialty_source_value
  data_type: varchar(50)
  required: false
  primary_key: false
  description: >-
    This refers to the specific type of healthcare provider or field of expertise listed in the source
    data, encompassing physician specialties like internal medicine, emergency medicine, etc., as well
    as allied health professionals such as nurses, midwives, and pharmacists. It covers medical specialties
    like surgery, internal medicine, and radiology, while other services like prosthetics, acupuncture,
    and physical therapy fall under the domain of "Service."
  etl_convention: >-
    The type of provider and their specialty should be entered as they appear in the source data. The
    decision to use either the coded value or the text description is left to the discretion of the ETL-er.
- name: specialty_source_concept_id
  data_type: integer
  required: false
  primary_key: false
  foreign_key:
    table: concept
    field: concept_id
  description: >-
    This is often zero as many sites use proprietary codes to store physician speciality.
  etl_convention: >-
    If the source data codes provider specialty in an OMOP supported vocabulary store the concept_id here.
- name: gender_source_value
  data_type: varchar(50)
  required: false
  primary_key: false
  description: >-
    This is provider's gender as it appears in the source data.
  etl_convention: >-
    Put the provider's gender as it appears in the source data. This field is up to the discretion of
    the ETL-er as to whether this should be the coded value from the source or the text description of
    the lookup value.
- name: gender_source_concept_id
  data_type: integer
  required: false
  primary_key: false
  foreign_key:
    table: concept
    field: concept_id
  description: >-
    This is often zero as many sites use proprietary codes to store provider gender.
  etl_convention: >-
    If the source data codes provider gender in an OMOP supported vocabulary store the concept_id here.
