version: 1
cdm_version: '5.4'
target_table: episode_event
cdm_schema: CDM
required: false
concept_prefix: null
measure_person_completeness: false
measure_person_completeness_threshold: null
description: >-
  The EPISODE_EVENT table connects qualifying clinical events (such as CONDITION_OCCURRENCE, DRUG_EXPOSURE,
  PROCEDURE_OCCURRENCE, MEASUREMENT) to the appropriate EPISODE entry. For example, linking the precise
  location of the metastasis (cancer modifier in MEASUREMENT) to the disease episode.
user_guidance: >-
  This connecting table is used instead of the FACT_RELATIONSHIP table for linking low-level events to
  abstracted Episodes.
etl_convention: >-
  Some episodes may not have links to any underlying clinical events. For such episodes, the EPISODE_EVENT
  table is not populated.
fields:
- name: episode_id
  data_type: integer
  required: true
  primary_key: false
  foreign_key:
    table: episode
    field: episode_id
  description: >-
    Use this field to link the EPISODE_EVENT record to its EPISODE.
  etl_convention: >-
    Put the EPISODE_ID that subsumes the EPISODE_EVENT record here.
- name: event_id
  data_type: integer
  required: true
  primary_key: false
  description: >-
    This field is the primary key of the linked record in the database. For example, if the Episode Event
    is a Condition Occurrence, then the CONDITION_OCCURRENCE_ID of the linked record goes in this field.
  etl_convention: >-
    Put the primary key of the linked record here.
- name: episode_event_field_concept_id
  data_type: integer
  required: true
  primary_key: false
  foreign_key:
    table: concept
    field: concept_id
    domain: Metadata
  description: >-
    This field is the CONCEPT_ID that identifies which table the primary key of the linked record came
    from.
  etl_convention: >-
    Put the CONCEPT_ID that identifies which table and field the EVENT_ID came from. [Accepted Concepts](https://athena.ohdsi.org/search-terms/terms?vocabulary=CDM&conceptClass=Field&page=1&pageSize=15&query=)
