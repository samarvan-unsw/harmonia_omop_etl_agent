description: >-
  A Dose Era is defined as a span of time when the Person is assumed to be exposed to a constant dose
  of a specific active ingredient.
user_guidance: ""
etl_convention: >-
  Dose Eras will be derived from records in the DRUG_EXPOSURE table and the Dose information from the
  DRUG_STRENGTH table using a standardized algorithm. Dose Form information is not taken into account.
  So, if the patient changes between different formulations, or different manufacturers with the same
  formulation, the Dose Era is still spanning the entire time of exposure to the Ingredient.
