  etl_convention: ""
- name: valid_start_date
  data_type: date
  required: true
  primary_key: false
  description: >-
    The date when the mapping

    instance was first recorded.
  etl_convention: ""
- name: valid_end_date
  data_type: date
  required: true
  primary_key: false
  description: >-
    The date when the mapping

    instance became invalid because it

