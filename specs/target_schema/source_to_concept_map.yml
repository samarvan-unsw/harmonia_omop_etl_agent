version: 1
cdm_version: '5.4'
target_table: source_to_concept_map
cdm_schema: VOCAB
required: false
concept_prefix: null
measure_person_completeness: false
measure_person_completeness_threshold: null
description: >-
  The source to concept map table is recommended for use in ETL processes to maintain local source codes
  which are not available as Concepts in the Standardized Vocabularies, and to establish mappings for
  each source code into a Standard Concept as target_concept_ids that can be used to populate the Common
  Data Model tables. The SOURCE_TO_CONCEPT_MAP table is no longer populated with content within the Standardized
  Vocabularies published to the OMOP community. **There are OHDSI tools to help you populate this table;
  [Usagi](https://github.com/OHDSI/Usagi) and [Perseus](https://github.com/ohdsi/Perseus). You can read
  more about OMOP vocabulary mapping in [The Book of OHDSI Chapter 6.3](https://ohdsi.github.io/TheBookOfOhdsi/ExtractTransformLoad.html#step-2-create-the-code-mappings).**
user_guidance: ""
etl_convention: ""
fields:
- name: source_code
  data_type: varchar(50)
  required: true
  primary_key: false
  description: >-
    The source code being translated

    into a Standard Concept.
  etl_convention: ""
- name: source_concept_id
  data_type: integer
  required: true
  primary_key: false
  foreign_key:
    table: concept
    field: concept_id
  description: >-
    A foreign key to the Source

    Concept that is being translated

    into a Standard Concept.
  etl_convention: >-
    This is either 0 or should be a number above 2 billion, which are the Concepts reserved for site-specific
    codes and mappings.
- name: source_vocabulary_id
  data_type: varchar(20)
  required: true
  primary_key: false
  description: >-
    A foreign key to the

    VOCABULARY table defining the

    vocabulary of the source code that

    is being translated to a Standard

    Concept.
  etl_convention: ""
- name: source_code_description
  data_type: varchar(255)
  required: false
  primary_key: false
  description: >-
    An optional description for the

    source code. This is included as a

    convenience to compare the

    description of the source code to

    the name of the concept.
  etl_convention: ""
- name: target_concept_id
  data_type: integer
  required: true
  primary_key: false
  foreign_key:
    table: concept
    field: concept_id
  description: >-
    The target Concept

    to which the source code is being

    mapped.
  etl_convention: ""
- name: target_vocabulary_id
  data_type: varchar(20)
  required: true
  primary_key: false
  foreign_key:
    table: vocabulary
