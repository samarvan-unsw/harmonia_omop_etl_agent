description: >-
  The LOCATION table represents a generic way to capture physical location or address information of Persons
  and Care Sites.
user_guidance: >-
  The current iteration of the LOCATION table is US centric. Until a major release to correct this, certain
  fields can be used to represent different international values.


  - STATE can also be used for province or district


  - ZIP is also the postal code or postcode


  - COUNTY can also be used to represent region
etl_convention: >-
  Each address or Location is unique and is present only once in the table. Locations do not contain names,
  such as the name of a hospital. In order to construct a full address that can be used in the postal
  service, the address information from the Location needs to be combined with information from the Care
  Site.
