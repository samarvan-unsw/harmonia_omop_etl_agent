version: 1
target_table: person

source_models:
  - cai_01_patient

# The selected CardiacAI lane contains only cai_01_patient, so no source-model
# joins are required.
joins: []

fields:
  - target_field: person_id
    action: map
    source_fields:
      - model: cai_01_patient
        field: patient_id
    transformation: >
      Cast patient_id to integer. The projected OMOP comment says to make sure
      the ID is an integer.

  - target_field: gender_concept_id
    action: map
    source_fields:
      - model: cai_01_patient
        field: sex
    transformation: >
      Convert Male, Female and null to concept IDs 8507, 8532 and 8570
      respectively, as stated in the projected OMOP comment.
    mapping_table_name:
    review_required: true
    review_status: approved
    review_comment: >
      The drawio explicitly requires a mapping table and supplies the three
      concept IDs. Confirm the lookup relation contains the approved source
      values before production use.

  - target_field: year_of_birth
    action: map
    source_fields:
      - model: cai_01_patient
        field: year_of_birth
    transformation: Cast year_of_birth to integer.

  - target_field: month_of_birth
    action: skip
    source_fields: []
    transformation: Skip as directed by the projected OMOP comment.

  - target_field: day_of_birth
    action: skip
    source_fields: []
    transformation: Skip as directed by the projected OMOP comment.

  - target_field: birth_datetime
    action: skip
    source_fields: []
    transformation: Skip as directed by the projected OMOP comment.

  - target_field: race_concept_id
    action: derive
    source_fields:
      - model: cai_01_patient
        field: indigenous_status
      - model: cai_01_patient
        field: country_of_birth
    transformation: >
      Use a controlled mapping relation to map the declared source values to
      race_concept_id. The projected OMOP comment allows an IF expression only
      when the controlled mapping contains a single concept ID.
    mapping_table_name:
    review_required: true
    review_status: approved
    review_comment: >
      The projected OMOP comment does not supply the actual race concept ID or
      its corresponding source value. Populate and approve the controlled
      mapping relation before generation.

  - target_field: ethnicity_concept_id
    action: skip
    source_fields: []
    transformation: Skip because the projected OMOP comment says "NA. Skip."

  - target_field: person_source_value
    action: map
    source_fields:
      - model: cai_01_patient
        field: patient_id
    transformation: Cast patient_id to varchar(50).

  - target_field: gender_source_value
    action: map
    source_fields:
      - model: cai_01_patient
        field: sex
    transformation: Cast sex to varchar(50).

  - target_field: gender_source_concept_id
    action: derive
    source_fields:
      - model: cai_01_patient
        field: sex
    transformation: >
      Derive gender_source_concept_id from sex using a controlled mapping
      relation. The selected drawio lanes provide source lineage but no
      conversion rule.
    mapping_table_name:
    review_required: true
    review_status: approved
    review_comment: >
      The CardiacAI lane links sex to gender_source_concept_id, but the
      projected OMOP field contains no Comment or date-prefixed mapping rule.
      Define and approve the conversion before generation.

  - target_field: race_source_value
    action: derive
    source_fields:
      - model: cai_01_patient
        field: indigenous_status
    transformation: >
      Populate race_source_value from indigenous_status.


# Optional projected OMOP fields with no CardiacAI lane connection and no
# Comment/date-prefixed mapping instruction are intentionally omitted. The
# agent emits typed NULLs for them:
# location_id, provider_id, care_site_id, race_source_concept_id,
# ethnicity_source_value and ethnicity_source_concept_id.
