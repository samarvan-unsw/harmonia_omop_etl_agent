provider: codex
model: gpt-5.3-codex

# Maximum generated tokens for each API request.
max_output_tokens: 800

# Refuse unexpectedly large initial prompts before loading the API provider.
max_initial_prompt_characters: 12000

# Disable automatic SDK retries while development spending is tightly controlled.
max_api_retries: 0

# Hard bounds for project-level choices submitted through the UI.
project_limits:
  allowed_models:
    - gpt-5.3-codex
    - gpt-5.6-terra
    - gpt-5.6-luna
    - gpt-5.6-sol
    - claude-sonnet-4-6
  model_providers:
    gpt-5.3-codex: codex
    gpt-5.6-terra: codex
    gpt-5.6-luna: codex
    gpt-5.6-sol: codex
    claude-sonnet-4-6: anthropic
  maximum_output_tokens_per_request: 4000
  maximum_initial_prompt_characters: 50000
  maximum_generation_attempts: 2
  maximum_api_retries: 2

# Standard API pricing snapshot used for estimates only. Review these rates
# against https://developers.openai.com/api/docs/models/compare whenever
# models or prices change.
pricing:
  currency: USD
  verified_on: 2026-08-11
  models:
    gpt-5.3-codex:
      input_usd_per_million_tokens: 1.75
      cached_input_usd_per_million_tokens: 0.175
      cache_write_input_usd_per_million_tokens: 1.75
      output_usd_per_million_tokens: 14.00
    gpt-5.6-terra:
      input_usd_per_million_tokens: 2.50
      cached_input_usd_per_million_tokens: 0.25
      cache_write_input_usd_per_million_tokens: 3.125
      output_usd_per_million_tokens: 15.00
    gpt-5.6-luna:
      input_usd_per_million_tokens: 1.00
      cached_input_usd_per_million_tokens: 0.10
      cache_write_input_usd_per_million_tokens: 1.25
      output_usd_per_million_tokens: 6.00
    gpt-5.6-sol:
      input_usd_per_million_tokens: 5.00
      cached_input_usd_per_million_tokens: 0.50
      cache_write_input_usd_per_million_tokens: 6.25
      output_usd_per_million_tokens: 30.00
    claude-sonnet-4-6:
      input_usd_per_million_tokens: 3.00
      cached_input_usd_per_million_tokens: 0.30
      cache_write_input_usd_per_million_tokens: 3.75
      output_usd_per_million_tokens: 15.00

source:
  reference_style: dbt_ref  # relation | dbt_ref | dbt_source

output:
  # Generate plain SQL unless the user explicitly selects another format.
  format: dbt           # sql | dbt
  # snowflake | postgres | athena | bigquery | sql_server | spark |
  # oracle | redshift | synapse
  dialect: snowflake
